apiVersion: v1
kind: Secret
metadata:
  name: voicebook-secrets
  namespace: default
  labels:
    app: voicebook
type: Opaque
stringData:
  # IMPORTANT: Do not commit actual secrets to version control!
  # This is a template. Create secrets using one of these methods:
  #
  # Method 1: kubectl create secret
  # kubectl create secret generic voicebook-secrets \
  #   --from-literal=openai-api-key=sk-your-actual-key-here \
  #   -n default
  #
  # Method 2: Sealed Secrets (recommended for GitOps)
  # https://github.com/bitnami-labs/sealed-secrets
  #
  # Method 3: External Secrets Operator
  # https://external-secrets.io/
  #
  # Method 4: HashiCorp Vault
  # https://www.vaultproject.io/

  openai-api-key: "REPLACE_WITH_YOUR_ACTUAL_KEY"  # Change this!

---
