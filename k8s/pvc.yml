apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voicebook-cache-pvc
  namespace: default
  labels:
    app: voicebook
    component: cache
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods can read/write (requires NFS or similar)
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard  # Change based on your cloud provider
  # For AWS EFS: efs-sc
  # For GCP Filestore: filestore
  # For Azure Files: azurefile

---
# Optional: StorageClass example for AWS EFS
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: efs-sc
# provisioner: efs.csi.aws.com
# parameters:
#   provisioningMode: efs-ap
#   fileSystemId: fs-xxxxxxxxx
#   directoryPerms: "700"

---
# Optional: StorageClass example for GCP Filestore
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: filestore
# provisioner: filestore.csi.storage.gke.io
# parameters:
#   tier: standard
#   network: default
