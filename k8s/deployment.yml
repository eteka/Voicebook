apiVersion: apps/v1
kind: Deployment
metadata:
  name: voicebook
  namespace: default
  labels:
    app: voicebook
    version: v1.0.0
    component: web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: voicebook
  template:
    metadata:
      labels:
        app: voicebook
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8501"
        prometheus.io/path: "/metrics"
    spec:
      # Security context for pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Service account
      serviceAccountName: voicebook

      # Init container to wait for dependencies (if needed)
      # initContainers:
      #   - name: wait-for-db
      #     image: busybox:1.36
      #     command: ['sh', '-c', 'until nc -z postgres 5432; do sleep 2; done']

      containers:
      - name: voicebook
        image: ghcr.io/eteka/voicebook:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8501
          protocol: TCP

        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: voicebook-secrets
              key: openai-api-key
        - name: CACHE_DIRECTORY
          value: "/app/cache"
        - name: STREAMLIT_SERVER_PORT
          value: "8501"
        - name: STREAMLIT_SERVER_ADDRESS
          value: "0.0.0.0"

        # Resource limits and requests
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        # Startup probe (for slow starting applications)
        startupProbe:
          httpGet:
            path: /_stcore/health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 12

        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Streamlit needs write access
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL

        # Volume mounts
        volumeMounts:
        - name: cache-volume
          mountPath: /app/cache
        - name: tmp
          mountPath: /tmp

      # Volumes
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: voicebook-cache-pvc
      - name: tmp
        emptyDir: {}

      # Pod disruption budget reference
      # Ensures high availability during updates

      # Affinity rules for better distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - voicebook
              topologyKey: kubernetes.io/hostname

      # Tolerations (if needed for specific node pools)
      # tolerations:
      # - key: "workload"
      #   operator: "Equal"
      #   value: "web"
      #   effect: "NoSchedule"
