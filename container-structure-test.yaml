schemaVersion: '2.0.0'

# Command Tests - Verify commands work correctly
commandTests:
  - name: "Python version check"
    command: "python"
    args: ["--version"]
    expectedOutput: ["Python 3.11.*"]

  - name: "Pip is installed"
    command: "pip"
    args: ["--version"]
    expectedOutput: ["pip.*"]

  - name: "Streamlit is installed"
    command: "streamlit"
    args: ["--version"]
    expectedOutput: ["Streamlit.*"]

  - name: "Non-root user check"
    command: "whoami"
    expectedOutput: ["voicebook"]

  - name: "Home directory exists"
    command: "pwd"
    expectedOutput: ["/app"]

# File Existence Tests
fileExistenceTests:
  - name: "Application source exists"
    path: "/app/src"
    shouldExist: true
    permissions: "-rwxr-xr-x"  # At least readable

  - name: "Requirements file exists"
    path: "/app/requirements.txt"
    shouldExist: true

  - name: "Cache directory exists"
    path: "/app/cache"
    shouldExist: true
    permissions: "drwxr-xr-x"

  - name: "Virtual environment exists"
    path: "/opt/venv"
    shouldExist: true

  - name: "No .git directory (security)"
    path: "/app/.git"
    shouldExist: false

  - name: "No __pycache__ in image"
    path: "/app/__pycache__"
    shouldExist: false

  - name: "No development dependencies"
    path: "/app/requirements-dev.txt"
    shouldExist: false

# File Content Tests
fileContentTests:
  - name: "requirements.txt contains streamlit"
    path: "/app/requirements.txt"
    expectedContents: ['streamlit>=.*']

  - name: "requirements.txt contains openai"
    path: "/app/requirements.txt"
    expectedContents: ['openai>=.*']

# Metadata Tests
metadataTest:
  # Environment variables
  env:
    - key: "PYTHONUNBUFFERED"
      value: "1"
    - key: "PYTHONDONTWRITEBYTECODE"
      value: "1"
    - key: "PATH"
      value: "/opt/venv/bin:.*"
    - key: "STREAMLIT_SERVER_PORT"
      value: "8501"
    - key: "STREAMLIT_SERVER_HEADLESS"
      value: "true"

  # Exposed ports
  exposedPorts: ["8501"]

  # Volumes
  volumes:
    - /app/cache

  # Entry point
  cmd:
    - "streamlit"
    - "run"
    - "src/ui/app.py"

  # Working directory
  workdir: "/app"

  # Labels
  labels:
    - key: "maintainer"
      value: "Voicebook Contributors"
    - key: "version"
      value: "1.0.0"

# License Tests
licenseTests:
  - debian: true
    files: []
