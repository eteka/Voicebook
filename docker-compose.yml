version: '3.8'

services:
  voicebook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicebook-app
    image: voicebook:latest
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CACHE_DIRECTORY=/app/cache
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      # Mount cache directory for persistence
      - ./cache:/app/cache:rw
      # Mount .env file (optional, environment variables preferred)
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - voicebook-network
    labels:
      - "com.voicebook.description=Voicebook TTS application"
      - "com.voicebook.version=1.0.0"

