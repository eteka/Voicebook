[pytest]
# Pytest Configuration for Voicebook

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Add command line options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Enable strict markers
    --strict-markers
    # Show warnings
    -W default
    # Coverage options
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    # Parallel execution (optional, uncomment to enable)
    # -n auto

# Custom markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires resources)
    slow: Slow running tests
    api: Tests that call external APIs (requires API key)
    cache: Tests related to caching functionality
    processors: Tests for document processors

# Coverage settings
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    # Standard exclusions
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    # Debug-only code
    if self\.debug
    if settings\.DEBUG

[coverage:html]
directory = htmlcov
